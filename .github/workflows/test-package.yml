# Install and test
name: Python package
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # pin@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install .[dev]
      - name: Check docstrings
        run: python -m pydocstyle edgetest_hub --convention=numpy
      - name: Check static typing
        run: python -m mypy edgetest_hub
      - name: Run flake8
        run: python -m flake8 edgetest_hub
      - name: Run unit testing
        run: python -m pytest tests --cov=edgetest_hub --cov-fail-under=90
